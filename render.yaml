services:
  - type: web
    name: fix-retouch
    runtime: docker
    plan: starter
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_ACCESS_PASSWORD
        sync: false
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2
